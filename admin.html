<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit · AI Native Healthcare</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand-mark">MH</div>
    <h1>AI Native Healthcare CMS</h1>
    <p>Mark Han의 공개 연구노트 편집 공간</p>
    <div class="nav">
      <div class="nav-group-label">SITE STRUCTURE</div>
      <button data-panel="site-brand">01 · Brand & Navigation</button>
      <button data-panel="site-home">02 · Home</button>
      <button data-panel="site-pages">03 · Section Pages</button>
      <button data-panel="site-about">04 · About</button>
      <button data-panel="site-system">05 · Footer & UI</button>
      <div class="nav-group-label">PUBLISHING</div>
      <button data-panel="publishing">Publication Dashboard</button>
      <div class="nav-group-label">CONTENT COLLECTIONS</div>
      <button data-panel="notes">Writing · Field Notes</button>
      <button data-panel="essays">Writing · Essays</button>
      <button data-panel="concepts">Ideas</button>
      <button data-panel="projects">Work</button>
      <button data-panel="research">Research</button>
    </div>
    <div class="sidebar-foot">
      <div id="saveState" class="save-state">저장됨</div>
      <a class="public" href="index.html" target="_blank">공개 사이트 보기 ↗</a>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <div class="eyebrow">CONTENT STUDIO</div>
        <h2 id="title"></h2>
        <p class="note">서식이 적용된 본문은 공개 사이트에 그대로 표시됩니다.</p>
      </div>
      <div class="actions">
        <button class="btn secondary" id="addButton" onclick="add()">＋ 새 항목</button>
        <button class="btn secondary" onclick="exportPublished()">발행 데이터 내보내기</button>
        <button class="btn secondary" onclick="exportJSON()">전체 JSON 백업</button>
        <label class="btn secondary">JSON 복원<input hidden type="file" accept=".json" onchange="importJSON(event)"></label>
        <button class="btn secondary" onclick="resetAll()">초기화</button>
        <button class="btn" onclick="save(true)">저장</button>
      </div>
    </div>
    <div class="editor-guide">
      <b>Rich text editor</b>
      <span>본문을 선택한 뒤 제목, 인용, 폰트, 크기, 정렬, 링크, 이미지 도구를 사용할 수 있습니다.</span>
    </div>
    <section class="panel"><div id="content"></div></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
